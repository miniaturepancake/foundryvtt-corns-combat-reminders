name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json
        run: |
          jq \
            --arg version "${{ steps.vars.outputs.version }}" \
            --arg url "https://github.com/${{ github.repository }}" \
            --arg manifest "https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
            --arg download "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip" \
            '.version=$version | .url=$url | .manifest=$manifest | .download=$download' \
            module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build module.zip
        run: zip -r module.zip module.json scripts styles README.md LICENSE

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
